name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The verified compiler floor (see gleam.toml).
          - gleam: "1.14.0"
            otp: "27"
          # Current toolchain.
          - gleam: "1.18.1"
            otp: "28"
    name: test (gleam ${{ matrix.gleam }}, otp ${{ matrix.otp }})
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          gleam-version: ${{ matrix.gleam }}
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
      # Node runs the JavaScript target, including the playground e2e runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Hex package cache, shared by the root project and the playground.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/gleam
          key: ${{ runner.os }}-gleam-deps-${{ hashFiles('**/manifest.toml') }}
          restore-keys: ${{ runner.os }}-gleam-deps-
      - run: gleam deps download
      - run: gleam test
      - run: gleam test --target javascript

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          hexpm-mirrors: |
            https://builds.hex.pm
            https://cdn.jsdelivr.net/hex
      - run: gleam format --check src test
