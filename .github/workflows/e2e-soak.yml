# Temporary soak workflow to reproduce the intermittent
# vouch_e2e_test.playground_erlang_e2e_test all_json_objects failure
# (a non-JSON line in the inner run's stdout). Remove once resolved.
name: e2e-soak

on:
  workflow_dispatch:
    inputs:
      cold_iterations:
        description: Iterations with the build directory wiped each run
        default: "120"
      touch_iterations:
        description: Iterations with a forced recompile each run
        default: "120"
      warm_iterations:
        description: Steady-state iterations
        default: "300"
  push:
    branches: [claude/serene-hofstadter-eaa3f4]

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
      - name: Prime outer build (mirrors CI before the e2e tests run)
        run: gleam deps download && gleam build
      - name: Cold soak (wipe playground build each iteration)
        run: |
          escript .github/soak/e2e_soak.escript plain \
            "${{ github.event.inputs.cold_iterations || '120' }}" \
            examples/playground soak-failures wipe:examples/playground/build \
            2> cold_stderr.log || echo "COLD_FAILED=1" >> "$GITHUB_ENV"
      - name: Touch soak (force recompile each iteration)
        run: |
          escript .github/soak/e2e_soak.escript plain \
            "${{ github.event.inputs.touch_iterations || '120' }}" \
            examples/playground soak-failures touch:examples/playground/src/playground.gleam \
            2> touch_stderr.log || echo "TOUCH_FAILED=1" >> "$GITHUB_ENV"
      - name: Warm soak (steady state)
        run: |
          escript .github/soak/e2e_soak.escript plain \
            "${{ github.event.inputs.warm_iterations || '300' }}" \
            examples/playground soak-failures \
            2> warm_stderr.log || echo "WARM_FAILED=1" >> "$GITHUB_ENV"
      - name: Hex dump any failures
        if: always()
        run: |
          if [ -d soak-failures ] && [ -n "$(ls -A soak-failures 2>/dev/null)" ]; then
            for f in soak-failures/*; do
              echo "==== $f ===="
              xxd "$f" | tail -40
            done
          else
            echo "no failures captured"
          fi
      - name: Upload failure captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-captures
          path: |
            soak-failures/
            cold_stderr.log
            touch_stderr.log
            warm_stderr.log
          if-no-files-found: ignore
      - name: Fail if any soak phase failed
        run: |
          if [ -n "$COLD_FAILED$TOUCH_FAILED$WARM_FAILED" ]; then
            echo "soak reproduced the failure"
            exit 1
          fi
