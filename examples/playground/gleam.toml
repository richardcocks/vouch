name = "playground"
version = "0.0.1"

# A scratch consumer of vouch: a place to run the runner against slow,
# failing, todo-ing, and crashing tests that vouch's own (green) suite
# cannot contain. Expect a red exit code here — that is the point.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
# A regular dependency, not a dev one: gleam 1.14 (the supported compiler
# floor) silently ignores path dependencies under [dev_dependencies], which
# breaks this consumer with "Unknown module: vouch". Newer compilers accept
# either; the playground is never published, so nothing is lost.
vouch = { path = "../.." }
